name: Release

# Push a tag like v1.2.0 to build and publish a GitHub release: the macOS app (signed, notarized DMG), a Windows
# installer and .deb/.rpm packages for Linux, for x64 and arm64 on Windows and Linux. Or run manually from the Actions
# tab (manual runs default to a draft).
#
# TargetFrameworks in GitHubShine.csproj is conditioned on the build OS, so each head builds on its own runner and
# uploads an artifact; the last job checksums everything and publishes it as one release, which is what installed
# copies read to update themselves (see "The app updates itself" in docs/RELEASING.md before renaming any asset).
#
# Required repository secrets are documented in docs/RELEASING.md.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0) - creates the v<version> tag'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_VERSION: 10.0.4xx
  PROJECT: src/GitHubShine/GitHubShine.csproj
  # Only the TFM-root bundle is the finished universal app; osx-arm64/ and osx-x64/ are incomplete
  # lipo intermediates (unsigned dylibs, no wwwroot). See CLAUDE.md gotcha 3.
  APP_PATH: src/GitHubShine/bin/Release/net10.0-macos/GitHub Shine.app
  NFPM_VERSION: 2.48.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # CFBundleShortVersionString only allows up to three integers, so a v1.2.0-beta1 tag stamps the app 1.2.0.
          APP_VERSION="${VERSION%%-*}"
          if ! [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag version '$VERSION' must look like 1.2.3 or 1.2.3-suffix"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      DMG: artifacts/GitHubShine-${{ needs.version.outputs.version }}-osx-universal.dmg
    steps:
      - uses: actions/checkout@v7

      # The workload set's macOS SDK (27.0.10742) needs Xcode 27.1 exactly: the runner defaults to 27.0, and the
      # newest it has (a 27.2 beta) is refused too.
      - name: Xcode
        run: |
          XCODE=/Applications/Xcode_27.1.app
          if [ ! -d "$XCODE" ]; then ls -d /Applications/Xcode*.app; echo "No $XCODE on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # maui pulls in the ios/android workloads, which restore needs even for a -f net10.0-macos build because
      # the csproj lists all three Apple-host TFMs.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: macos, maui

      - name: Build
        run: |
          set -euo pipefail
          # `dotnet build`, NOT `dotnet publish`: publish strips the Blazor static web assets out of
          # Contents/Resources and the WebView renders blank. See CLAUDE.md gotcha 3.
          dotnet build "$PROJECT" -c Release -f net10.0-macos \
            -p:ApplicationDisplayVersion="$APP_VERSION" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -clp:NoSummary -nologo

      - name: Validate the universal bundle
        run: |
          set -euo pipefail
          [ -d "$APP_PATH" ] || { ls src/GitHubShine/bin/Release/net10.0-macos; echo "No universal bundle at $APP_PATH"; exit 1; }
          WWW="$(find "$APP_PATH/Contents/Resources" -type f | wc -l | tr -d ' ')"
          echo "Resources files: $WWW"
          if [ "$WWW" -lt 10 ]; then
            echo "Bundle has only $WWW resource files - static web assets are missing and the WebView would be blank"
            exit 1
          fi
          lipo -archs "$APP_PATH/Contents/MacOS/GitHubShine"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_MACOS_DIRECT_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_MACOS_DIRECT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # The build leaves the bundle ad-hoc signed; re-sign bottom-up with the Developer ID identity, hardened
      # runtime and eng/macos-dist.entitlements, then wrap it in a signed DMG.
      - name: Sign and package
        run: |
          set -euo pipefail
          eng/ci/sign-macos-app.sh "$APP_PATH" "$SIGNING_IDENTITY"
          eng/ci/make-dmg.sh "$APP_PATH" "$DMG" "$SIGNING_IDENTITY"

      - name: Notarize
        env:
          AC_API_KEY_P8: ${{ secrets.APPLE_MY_IDENTITY_P8_KEY }}
          AC_API_KEY_ID: ${{ secrets.APPLE_MY_IDENTITY_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.APPLE_MY_IDENTITY_ISSUER_ID }}
        run: |
          set -euo pipefail
          eng/ci/notarize.sh "$DMG"
          # Gatekeeper's own verdict on the stapled artifact - the real end-user check.
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      # Only the DMG: installed copies pick the release's one *.dmg as their update, so nothing else from this
      # job may end in .dmg.
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: maui-windows

      # Publish is fine here - the static-web-asset trap is the macOS bundle's (CLAUDE.md gotcha 3); a Windows
      # publish copies wwwroot/ next to the exe, and the check below holds it to that.
      # Self-contained - .NET and the Windows App SDK both - so nobody has to install a runtime first. WebView2 is
      # not bundled: it ships with Windows 11 and current Windows 10.
      # No -p:Version: Microsoft.Maui.Core's WinUI.targets already sets Version from ApplicationDisplayVersion, which
      # is what AppInfo.VersionString (and so the update check) reads on an unpackaged build.
      # Both architectures from one runner: LibGit2Sharp.NativeBinaries ships win-x64 and win-arm64 natives.
      # Unsigned for now: SmartScreen warns about an unknown publisher until there is a certificate to sign with.
      - name: Build
        run: |
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish "$env:PROJECT" -c Release -f net10.0-windows10.0.19041.0 -r "win-$arch" `
              --self-contained `
              -p:WindowsAppSDKSelfContained=true `
              -p:ApplicationDisplayVersion="$env:APP_VERSION" `
              -p:ApplicationVersion="${{ github.run_number }}" `
              -o "publish/win-$arch" `
              -clp:NoSummary -nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # A publish that dropped the web assets starts cleanly and shows a blank window - fail instead.
            $www = @(Get-ChildItem "publish/win-$arch/wwwroot" -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "win-$arch wwwroot files: $www"
            if ($www -lt 10) { throw "win-$arch publish has only $www wwwroot files - the WebView would be blank" }
            if (-not (Test-Path "publish/win-$arch/GitHubShine.exe")) { throw "No GitHubShine.exe in publish/win-$arch" }
          }

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            & $iscc.FullName "/DAppVersion=$env:VERSION" "/DFileVersion=$env:APP_VERSION" "/DArch=$arch" `
              "/DSourceDir=$PWD\publish\win-$arch" "/DOutputDir=$PWD\artifacts" eng\installers\windows\GitHubShine.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      # UseMaui=true in the csproj makes the SDK import Microsoft.Maui.Sdk.net10 even for the plain net10.0 GTK
      # head, and that pack only comes from a workload. maui-android is the one that both carries it and installs on
      # Linux (`maui` itself does not - it includes Mac Catalyst and Windows).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: maui-android

      # Both architectures from one runner: the app is managed code over GTK, which it loads from the system at run
      # time, and the only natives it carries (libgit2, e_sqlite3) ship linux-x64 and linux-arm64 builds in their
      # packages - so an arm64 publish only needs the arm64 runtime pack. -f net10.0 is the only TFM a Linux host
      # sees. Version is the whole tag: the labs GTK Essentials' AppInfo.VersionString (what the update check compares
      # against releases) reads the assembly attributes, and unlike WinUI nothing maps ApplicationDisplayVersion onto
      # them, so without it every build reports 1.0.0.
      - name: Build
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            dotnet publish "$PROJECT" -c Release -f net10.0 -r "linux-$arch" --self-contained \
              -p:Version="$VERSION" \
              -p:ApplicationDisplayVersion="$APP_VERSION" \
              -p:ApplicationVersion="${{ github.run_number }}" \
              -o "publish/linux-$arch" \
              -clp:NoSummary -nologo

            # Blazor renders into a WebView loaded from these files; without them the window is blank.
            WWW="$(find "publish/linux-$arch/wwwroot" -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo "linux-$arch wwwroot files: $WWW"
            [ "$WWW" -ge 10 ] || { echo "linux-$arch publish has only $WWW wwwroot files - the WebView would be blank"; exit 1; }
            [ -f "publish/linux-$arch/GitHubShine" ] || { echo "No GitHubShine executable in publish/linux-$arch"; exit 1; }
            [ -f "publish/linux-$arch/libgit2-5853918.so" ] || { echo "No libgit2 native in publish/linux-$arch"; exit 1; }
            chmod +x "publish/linux-$arch/GitHubShine"
          done

      - name: nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -p checksums.txt
          grep " nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # nfpm takes Debian's architecture names and maps them to x86_64/aarch64 for the .rpm. Dependencies and why
      # each one is there: eng/installers/linux/nfpm.yaml.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then ARCH=amd64; else ARCH=arm64; fi
            VERSION="$VERSION" ARCH="$ARCH" PUBLISH_DIR="publish/linux-$arch" \
              envsubst < eng/installers/linux/nfpm.yaml > "$RUNNER_TEMP/nfpm-$arch.yaml"
            for format in deb rpm; do
              nfpm package -f "$RUNNER_TEMP/nfpm-$arch.yaml" -p "$format" -t "artifacts/GitHubShine-$VERSION-linux-$arch.$format"
            done
          done
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [ version, macos, windows, linux ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The self-update contract (docs/RELEASING.md): exactly one *.dmg - the app takes the first one it sees.
      - name: Check assets
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -l
          DMGS="$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          [ "$DMGS" = 1 ] || { echo "Expected exactly one .dmg, found $DMGS"; exit 1; }

      # `<hex>  <name>` per line - the same format as `shasum -a 256`, which is what the macOS updater parses
      # (it looks up the DMG's line by exact file name and ignores the rest). Covers every asset, so it is also
      # the only integrity check there is for the unsigned Windows installer.
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            ARGS+=(--draft)
          fi
          if [ "$VERSION" != "$APP_VERSION" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "GitHub Shine $VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            "${ARGS[@]}"
