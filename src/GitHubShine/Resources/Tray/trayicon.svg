<!-- Source for the macOS template tray icon: a solid-black 4-point "shine" sparkle on a
     transparent canvas. macOS recolors template images per menu-bar appearance, so this is
     intentionally monochrome. Rendered to trayicon.png / @2x / @3x (22/44/66 px). -->
<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
    <path d="M 22 3
             Q 26 18 41 22
             Q 26 26 22 41
             Q 18 26 3 22
             Q 18 18 22 3 Z"
          fill="#000000"/>
    <path d="M 35 6
             Q 36.5 11 41 12.5
             Q 36.5 14 35 19
             Q 33.5 14 29 12.5
             Q 33.5 11 35 6 Z"
          fill="#000000"/>
</svg>
