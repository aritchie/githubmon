<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Full composed icon for "GitHub Shine": GitHub canvas-dark squircle + a shining
     sparkle/glint (a nod to the "shine a spotlight on your repos" slogan and Shiny.NET).
     The squircle is inset ~10% per macOS Dock guidelines (content grid = 368/456)
     with corner radius ~22% of the tile, so it sits naturally beside other Dock icons. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- warm "shine" gradient: bright at top, amber below -->
        <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFE9A8"/>
            <stop offset="0.5" stop-color="#FFC23D"/>
            <stop offset="1" stop-color="#F0A012"/>
        </linearGradient>
        <!-- soft glow behind the sparkle -->
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFC23D" stop-opacity="0.55"/>
            <stop offset="0.55" stop-color="#FFC23D" stop-opacity="0.12"/>
            <stop offset="1" stop-color="#FFC23D" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- GitHub canvas-dark squircle -->
    <rect x="44" y="44" width="368" height="368" rx="82" ry="82" fill="#0D1117"/>

    <!-- radial glow -->
    <circle cx="228" cy="232" r="150" fill="url(#glow)"/>

    <!-- radiating light rays along the diagonals -->
    <g stroke="#FFC23D" stroke-width="9" stroke-linecap="round" opacity="0.7">
        <line x1="300" y1="160" x2="332" y2="128"/>
        <line x1="156" y1="160" x2="124" y2="128"/>
        <line x1="300" y1="304" x2="332" y2="336"/>
        <line x1="156" y1="304" x2="124" y2="336"/>
    </g>

    <!-- primary 4-point sparkle -->
    <path d="M 228 112
             Q 252 208 344 232
             Q 252 256 228 352
             Q 204 256 112 232
             Q 204 208 228 112 Z"
          fill="url(#shine)"/>

    <!-- secondary mini sparkle, top-right -->
    <path d="M 330 138
             Q 338 162 360 170
             Q 338 178 330 202
             Q 322 178 300 170
             Q 322 162 330 138 Z"
          fill="#FFE9A8"/>
</svg>
