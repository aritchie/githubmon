<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GitHub Shine</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Shiny.Blazor.Controls/css/shiny-theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="GitHubShine.styles.css" />
</head>
<body>
    <div id="app">
        <div class="boot-splash">Loading GitHub Shine…</div>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // Release notes are HTML from the release host; their links would navigate the WebView
        // away from the app. Send them to the system browser instead (ExternalLinks.cs).
        document.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('.release-notes a[href]');
            if (!a) return;
            e.preventDefault();
            DotNet.invokeMethodAsync('GitHubShine', 'OpenExternalLink', a.href);
        });
    </script>
</body>
</html>
